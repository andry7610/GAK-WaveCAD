# GAK-WaveCAD — конфигурация системы
# Сферическая оболочка: осмос → термалка → акустика → коллапс

# --- Общие параметры оболочки ---
shell:
  R: 0.05          # радиус, м
  h: 0.002          # толщина, м
  E: 2.0e9          # модуль Юнга, Па
  nu: 0.33          # коэффициент Пуассона
  rho: 1000.0       # плотность, кг/м³

# --- Модуль 1: Осмос ---
osmosis_monitor:
  R: 0.05
  C_in: 0.5         # концентрация внутри, моль/л
  C_out: 0.1        # концентрация снаружи, моль/л
  T: 310.0          # температура, К
  sigma_membrane: 1.0e-9  # проницаемость мембраны, м/с

# --- Модуль 2: Термалка ---
thermal_monitor:
  R: 0.05
  h: 0.002
  k: 0.6            # теплопроводность, Вт/(м·К)
  alpha: 70.0e-6    # КТР, 1/К
  E: 2.0e9
  nu: 0.33
  T_inner: 310.0    # температура внутри, К
  T_outer: 293.0    # температура снаружи, К
  n_layers: 20

# --- Модуль 3: Акустика ---
acoustic_monitor:
  R: 0.05
  rho: 1000.0
  E: 2.0e9
  nu: 0.33
  n_modes: 4
  duration: 8.0     # длительность сигнала, с
  fs: 20000         # частота дискретизации, Гц

# --- Модуль 4: Коллапс ---
born_collapse_monitor:
  R: 0.05
  h: 0.002
  E: 2.0e9
  nu: 0.33
  safety_factor: 1.5

# --- Модуль 5: Магноны ---
magnon_monitor:
  R: 0.05
  M_s: 140000.0        # намагниченность насыщения, А/м
  A_ex: 3.5e-12        # обменная константа, Дж/м
  K_anis: 610.0        # константа анизотропии, Дж/м³
  lambda_s: -5.9e-6    # магнитострикция
  gamma_bar: 28.0e9    # гиромагнитное отношение, Гц/Т
  B_ext: 0.1           # внешнее магнитное поле, Тл
  alpha_damp: 3.0e-4   # затухание Гилберта
