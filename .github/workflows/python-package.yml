name: Python package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pytest pyyaml

      - name: Run acoustic test
        run: python run_acoustic_test.py

      - name: Run born collapse test
        run: python run_born_collapse_test.py

      - name: Run coupling test
        run: python run_coupling_test.py

      - name: Run EM resonance test
        run: python run_em_resonance_test.py

      - name: Run magnon test
        run: python run_magnon_test.py

      - name: Run thermal test
        run: python run_thermal_test.py

      - name: Run osmosis test
        run: python run_osmosis_test.py

      - name: Run pytest
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v
