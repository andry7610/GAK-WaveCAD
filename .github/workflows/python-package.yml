name: Python package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pytest pyyaml

      - name: Run pytest
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v

      - name: Run simulation N=10000
        if: always()
        env:
          PYTHONPATH: .
        run: |
          python run.py
